<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kansas Rural Health Investment Explorer</title>
<style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fa;color:#0b2545}.load{height:100%;display:grid;place-items:center}.box{text-align:center;max-width:560px;padding:28px}.spin{width:34px;height:34px;border:4px solid #d6dde8;border-top-color:#0b2545;border-radius:50%;margin:0 auto 16px;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#a51d2d;white-space:pre-wrap}</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div class="load"><div class="box"><div class="spin"></div><strong>Loading Kansas Rural Health Investment Explorer…</strong><div id="msg" style="margin-top:8px;font-size:13px;color:#56617a">September 2026 program update</div></div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:13},(_,i)=>`assets/site-2026-09-09/part${String(i).padStart(2,'0')}.txt?v=20260909-3`);
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`${f}: HTTP ${r.status}`);return (await r.text()).trim();}));
    const b64=parts.join('');
    const bin=atob(b64);
    const gz=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);
    let html='';
    try {
      if('DecompressionStream' in window){
        const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
        html=await new Response(stream).text();
      }
    } catch(nativeErr){ html=''; }
    if(!html){
      if(!window.pako) throw new Error('Decoder library did not load.');
      html=window.pako.ungzip(gz,{to:'string'});
    }
    if(!html.toLowerCase().includes('<!doctype html') && !html.toLowerCase().includes('<html'))throw new Error('Site package did not decode correctly.');
    document.open();document.write(html);document.close();
  }catch(e){document.querySelector('.spin').style.display='none';const m=document.getElementById('msg');m.className='err';m.textContent='Unable to load the updated site.\n'+(e?.message || String(e));console.error(e);}
})();
</script>
</body>
</html>
